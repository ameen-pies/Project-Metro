# ==============================
# Docker Compose
# Adjust services to your project needs
# ==============================

services:
  # --- Backend API ---
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file: .env
    volumes:
      - ./Backend:/app
      - uploads_data:/app/uploads
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Frontend ---
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./Frontend/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped

  # --- Database ---
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mydb}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Redis (optional, uncomment if needed) ---
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

  # --- Neo4j (optional, uncomment if graph DB needed) ---
  # neo4j:
  #   image: neo4j:5-community
  #   environment:
  #     NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
  #   ports:
  #     - "7474:7474"
  #     - "7687:7687"
  #   volumes:
  #     - neo4j_data:/data
  #   restart: unless-stopped

  # --- ChromaDB (optional, uncomment if vector store needed) ---
  # chroma:
  #   image: chromadb/chroma:latest
  #   ports:
  #     - "8100:8000"
  #   volumes:
  #     - chroma_data:/chroma/chroma
  #   restart: unless-stopped

